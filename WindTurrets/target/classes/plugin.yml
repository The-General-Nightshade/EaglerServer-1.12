name: WindTurrets
main: shadowlord.windturrets.WindTurrets
version: "1.4.0"
api-version: 1.12
authors: [shadowlord]
softdepend: [WorldGuard]
commands:
  turret:
    description: Manage turrets
    usage: /turret
  turrets:
    description: Administer all turrets
    usage: /turrets admin gui
    permission: windturrets.admin
permissions:
  windturrets.use:
    description: Basic turret use
    default: op
  windturrets.admin:
    description: Admin turret management
    default: op
  windturrets.bypass:
    description: Immune to turret targeting
    default: op
